name: filmlinkd

services:
  db:
    # Refresh with:
    #   $ podman pull docker.io/library/postgres:18-trixie
    #   $ podman images --format '{{.Digest}}' docker.io/library/postgres:18-trixie
    image: postgres:18-trixie@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
    environment:
      POSTGRES_USER: "${DATABASE_USER:?DATABASE_USER must be set}"
      POSTGRES_PASSWORD: "${DATABASE_PASSWORD:?DATABASE_PASSWORD must be set}"
      POSTGRES_DB: "${DATABASE_NAME:?DATABASE_NAME must be set}"
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:?PG_SHARED_BUFFERS must be set}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:?PG_EFFECTIVE_CACHE_SIZE must be set}
      - -c
      - work_mem=${PG_WORK_MEM:?PG_WORK_MEM must be set}
      - -c
      - maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:?PG_MAINTENANCE_WORK_MEM must be set}
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 30s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  app:
    image: ghcr.io/jimlind/filmlinkd:self-hosted
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

#  backup:
#    image: ghcr.io/jimlind/filmlinkd-backup:latest
#    env_file: .env
#    volumes:
#      - backups:/backups
#      - ./rclone.conf:/config/rclone/rclone.conf:ro
#    depends_on:
#      db:
#        condition: service_healthy
#    restart: unless-stopped

volumes:
  pgdata: { }
#  backups: { }
